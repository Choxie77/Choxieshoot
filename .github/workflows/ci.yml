name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Choxieshoot (.app and .dmg)
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Run Self-Tests
        run: |
          B="build/Choxieshoot.app/Contents/MacOS/Choxieshoot"
          "$B" --selftest
          "$B" --drawtest
          "$B" --copytest
          "$B" --savetest
          "$B" --videotest
